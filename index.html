<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Manifest Link -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007bff">

<!-- Service Worker Register Script -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
    
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MadxSatyam| Professional URL Shortener</title>
    <!-- Google Font & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #ffffff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        input::placeholder {
            color: #475569;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
        }

        .result-box {
            display: none;
            margin-top: 24px;
            padding: 16px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
            animation: fadeIn 0.4s ease-in-out;
        }

        .result-header {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .result-link-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #1e293b;
            padding: 10px 14px;
            border-radius: 8px;
            word-break: break-all;
        }

        .result-link-wrapper a {
            color: #38bdf8;
            font-weight: 500;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-copy {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-copy:hover {
            background: #475569;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Quick 🎖️Links
            (SATYAM)
            </h1>
            <p>Shorten your links with custom alias & expiration</p>
        </div>

        <form id="shortForm">
            <!-- URL Input -->
            <div class="form-group">
                <label for="longUrl"><i class="fa-solid fa-link"></i> Destination URL</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-globe"></i>
                    <input type="url" id="longUrl" placeholder="https://example.com/my-long-link" required>
                </div>
            </div>

            <!-- Alias Input -->
            <div class="form-group">
                <label for="alias"><i class="fa-solid fa-pen-to-square"></i> Custom Alias (Optional)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-tag"></i>
                    <input type="text" id="alias" placeholder="e.g. my-custom-link">
                </div>
            </div>

            <!-- Expiration Date Input -->
            <div class="form-group">
                <label for="expDate"><i class="fa-regular fa-clock"></i> Expiration Date (Optional)</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-calendar-days"></i>
                    <input type="datetime-local" id="expDate">
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span>Shorten Link</span>
                <i class="fa-solid fa-bolt"></i>
            </button>
        </form>

        <!-- Result Box -->
        <div id="result" class="result-box">
            <div class="result-header">Your Shortened Link</div>
            <div class="result-link-wrapper">
                <a id="shortLink" href="#" target="_blank"></a>
                <button class="btn-copy" id="copyBtn" onclick="copyToClipboard()">
                    <i class="fa-regular fa-copy"></i> Copy
                </button>
            </div>
        </div>
    </div>

   <script>
    document.getElementById('shortForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const longUrl = document.getElementById('longUrl').value.trim();
        const alias = document.getElementById('alias').value.trim();
        const expDate = document.getElementById('expDate').value;

        const encodedUrl = btoa(encodeURIComponent(longUrl));

        let expTimestamp = "";
        if (expDate) {
            expTimestamp = new Date(expDate).getTime();
        }

        const baseUrl = window.location.href.replace('index.html', '');
        
        // Direct target setup to first.html
        let finalLink = `${baseUrl}first.html?dest=${encodedUrl}`;

        if (alias) {
            finalLink += `&alias=${encodeURIComponent(alias)}`;
        }
        if (expTimestamp) {
            finalLink += `&exp=${expTimestamp}`;
        }

        const shortLinkElement = document.getElementById('shortLink');
        shortLinkElement.href = finalLink;
        shortLinkElement.innerText = finalLink;
        document.getElementById('result').style.display = 'block';
    });

    function copyToClipboard() {
        const linkText = document.getElementById('shortLink').innerText;
        navigator.clipboard.writeText(linkText).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
            setTimeout(() => {
                copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
            }, 2000);
        });
    }
</script>


</body>
</html>
